<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="neonRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="paradoxGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Echo rings -->
  <circle cx="256" cy="270" r="170" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="10 14"/>
  <circle cx="256" cy="270" r="130" fill="none" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.2"/>
  <circle cx="256" cy="270" r="90" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="6 8"/>

  <!-- Ghost Echo Ship Shadow -->
  <path d="M 256 125 L 345 340 L 256 300 L 167 340 Z" fill="#f43f5e" fill-opacity="0.25" filter="url(#glow)"/>

  <!-- Main Hero Ship Neon Cyan -->
  <path d="M 256 100 L 360 330 L 256 285 L 152 330 Z" fill="url(#neonCyan)" filter="url(#glow)"/>
  <!-- Cockpit Core -->
  <polygon points="256,160 278,255 256,275 234,255" fill="#ffffff" fill-opacity="0.9"/>
  <!-- Wing Accents -->
  <polygon points="256,120 348,320 320,310 256,180" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6"/>
  <polygon points="256,120 164,320 192,310 256,180" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Paradox Core Ring (Center) -->
  <circle cx="256" cy="265" r="18" fill="url(#paradoxGold)" filter="url(#glow)"/>
  <circle cx="256" cy="265" r="8" fill="#ffffff"/>

  <!-- Energy Thruster Glow -->
  <polygon points="244,305 268,305 256,380" fill="url(#neonRose)" filter="url(#glow)"/>

  <!-- Bottom Brand Text -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="6" fill="#00f0ff" text-anchor="middle" filter="url(#glow)">ECHO 3D</text>
</svg>